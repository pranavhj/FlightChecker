[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "flightchecker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "anthropic>=0.25.0",
    "easyocr>=1.7.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "schedule>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flightchecker*"]
