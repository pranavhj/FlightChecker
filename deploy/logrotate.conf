# Installed by deploy/install_pi.sh as /etc/logrotate.d/flightchecker
# copytruncate: systemd appends to the file (StandardOutput=append:), so rotate in place.
/home/admin/flightchecker/logs/*.log {
    weekly
    maxsize 20M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
