routes:
  # Mum: Mumbai (BOM) -> San Francisco (SFO), stays of 20 to 35 days, leaving any day in the next
  # 3 months. The DC trips were booked on 2026-10-31 and removed from this list.
  # Each leg (BOM->SFO out, SFO->BOM back) is searched and filtered separately:
  # max 1 stop, under 26 h. Cheapest wins; the report also shows price + 15 USD/hour (best value).
  - origins: [BOM]
    destinations: [SFO]
    trips:
      start: "2026-11-01"
      last_outbound: "2027-01-31"   # last day she can leave Mumbai
      end: "2027-03-07"             # latest return = last_outbound + 35 days
      min_days: 20
      max_days: 35
    max_stops: 1
    max_duration_hours: 25.99   # strictly under 26 h, per leg

top_n_results: 5
