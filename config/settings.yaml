scoring:
  time_weight_usd_per_hour: 15.0

schedule:
  # Scheduled mode only (python -m flightchecker). On the Pi the systemd timer runs --once daily instead.
  runs_per_day: 3
  run_times_utc: ["14:00", "20:00", "02:00"]  # 7am / 1pm / 7pm PT

continuous:
  interval_minutes: 480  # Run every N minutes in continuous mode (--continuous) [8 hours = 3x/day]

# Single-use airline credit: trips are ranked by what you pay after it. Applied once per trip,
# never more than that airline's fares on the trip. Switched off 2026-10-31 (DC trip booked, and
# Southwest doesn't fly to Mumbai). Uncomment to use a credit again:
# coupon:
#   airline: "Southwest"
#   amount_usd: 100

price_alerts:
  min_drop_pct: 5.0

browser:
  headless: true
  slow_mo_ms: 150
  persistent_context_dir: ".browser_profile"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  # On Linux (the Pi): Debian chromium + the UA a headed Chrome on Linux sends (not "HeadlessChrome")
  executable_path_linux: "/usr/bin/chromium"
  user_agent_linux: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

discord:
  # Posted with --once --discord (the Pi timer) and in --continuous mode. Channel: #reminders.
  target: "1564021528419508386"
  send_command: ["~/diary/venv/bin/python", "~/diary/bin/discord-send.py"]
  env:
    HOME: "~/diary/home"   # discord-send.py reads the bot token from $HOME/.openclaw/openclaw.json

retries:
  max_attempts: 3
  backoff_seconds: [30, 120, 300]

ocr:
  primary: "claude_vision"
  claude_model: "haiku"
  easyocr_languages: ["en"]

sources:
  - google_flights
  # skyscanner disabled — Kasada "PRESS & HOLD" CAPTCHA blocks headless browsers

output:
  screenshots_dir: "outputs/screenshots"
  reports_dir: "outputs/reports"
  price_history_file: "outputs/price_history.json"

storage:
  backend: sqlite              # "sqlite" | "json"  (json = legacy price_history.json)
  db_file: outputs/flights.db
  csv_export: true             # write a CSV after each run
  csv_dir: outputs/csv
